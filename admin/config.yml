backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "worksheets"
    label: "📝 Worksheets"
    folder: "_worksheets"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Code", name: "code", widget: "string"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Is Free?", name: "free", widget: "boolean", default: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "PDF File", name: "file", widget: "file"}
      - {label: "Tags", name: "tags", widget: "list"}

  - name: "articles"
    label: "✍️ Articles"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Read Time", name: "readtime", widget: "string"}
      - {label: "Summary", name: "summary", widget: "text"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "courses"
    label: "🎬 Video Courses"
    folder: "_courses"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Code", name: "code", widget: "string"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Video URL", name: "video_url", widget: "string"}
      - {label: "Lessons", name: "lessons", widget: "number"}
      - {label: "Duration", name: "duration", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}

  - name: "flipbooks"
    label: "📖 Flipbooks"
    folder: "_flipbooks"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tag", name: "tag", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Flipbook URL", name: "url", widget: "string"}

  - name: "reviews"
    label: "⭐ Reviews"
    folder: "_reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Reviewer Name", name: "name", widget: "string"}
      - {label: "Product Code", name: "code", widget: "string"}
      - {label: "Rating", name: "rating", widget: "select", options: ["5", "4", "3"]}
      - {label: "Review", name: "body", widget: "text"}
      - {label: "Approved", name: "approved", widget: "boolean", default: false}

  - name: "gallery"
    label: "📸 Images"
    folder: "_gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Caption", name: "caption", widget: "string", required: false}
