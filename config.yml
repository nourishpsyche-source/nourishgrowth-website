backend:
  name: git-gateway
  branch: main
  site_domain: nourishpsyche-source.github.io/nourishgrowth-website

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "worksheets"
    label: "📝 Worksheets"
    folder: "_worksheets"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Code", name: "code", widget: "string"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Is Free?", name: "free", widget: "boolean", default: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "PDF File", name: "file", widget: "file"}
      - {label: "Tags", name: "tags", widget: "list"}

  - name: "articles"
    label: "✍️ Articles"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Read Time", name: "readtime", widget: "string"}
      - {label: "Summary", name: "summary", widget: "text"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "courses"
    label: "🎬 Video Courses"
    folder: "_courses"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Code", name: "code", widget: "string"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Video URL", name: "video_url", widget: "string"}
      - {label: "Lessons", name: "lessons", widget: "number"}
      - {label: "Duration", name: "duration", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false}

  - name: "flipbooks"
    label: "📖 Flipbooks"
    folder: "_flipbooks"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tag", name: "tag", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Flipbook URL", name: "url", widget: "string"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}

  - name: "reviews"
    label: "⭐ Reviews"
    folder: "_reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Reviewer Name", name: "name", widget: "string"}
      - {label: "Product Code", name: "code", widget: "string"}
      - {label: "Rating", name: "rating", widget: "select", options: ["5", "4", "3"]}
      - {label: "Review", name: "body", widget: "text"}
      - {label: "Approved", name: "approved", widget: "boolean", default: false}

  - name: "gallery"
    label: "📸 Images"
    folder: "_gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Caption", name: "caption", widget: "string", required: false}

  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - name: "counseling"
        label: "💬 Counseling Prices"
        file: "_settings/counseling.md"
        fields:
          - {label: "Video Session Price", name: "video_price", widget: "string", default: "Rp 500.000"}
          - {label: "Video Session Duration", name: "video_duration", widget: "string", default: "60 minutes"}
          - {label: "Call Session Price", name: "call_price", widget: "string", default: "Rp 350.000"}
          - {label: "Call Session Duration", name: "call_duration", widget: "string", default: "60 minutes"}
          - {label: "Text Session Price", name: "text_price", widget: "string", default: "Rp 200.000"}
          - {label: "Text Session Duration", name: "text_duration", widget: "string", default: "48-hour response"}
      - name: "general"
        label: "🌐 General Info"
        file: "_settings/general.md"
        fields:
          - {label: "WhatsApp Number", name: "whatsapp", widget: "string"}
          - {label: "Instagram Handle", name: "instagram", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Hero Quote", name: "hero_quote", widget: "text"}
          - {label: "Hero Quote Author", name: "hero_author", widget: "string"}
