backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "worksheets"
    label: "📝 Worksheets"
    folder: "_worksheets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Code", name: "code", widget: "string", hint: "e.g. WS-005" }
      - { label: "Price", name: "price", widget: "string", hint: "e.g. Rp 45.000 or FREE" }
      - { label: "Is Free?", name: "free", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "PDF File", name: "file", widget: "file", media_folder: "/uploads/worksheets" }
      - { label: "Tags", name: "tags", widget: "list", hint: "e.g. Coloring, Writing, Puzzle" }

  - name: "articles"
    label: "✍️ Articles"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Read Time", name: "readtime", widget: "string", hint: "e.g. 8 min read" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "courses"
    label: "🎬 Video Courses"
    folder: "_courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Code", name: "code", widget: "string", hint: "e.g. CRS-04" }
      - { label: "Price", name: "price", widget: "string", hint: "e.g. Rp 350.000" }
      - { label: "Video URL", name: "video_url", widget: "string", hint: "YouTube or Vimeo link" }
      - { label: "Lessons", name: "lessons", widget: "number" }
      - { label: "Duration", name: "duration", widget: "string", hint: "e.g. 4.5 Hours" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }

  - name: "flipbooks"
    label: "📖 Flipbooks"
    folder: "_flipbooks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tag", name: "tag", widget: "string", hint: "e.g. Child Dev, Parenting" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Flipbook URL", name: "url", widget: "string", hint: "FlipHTML5 or Issuu link" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }

  - name: "reviews"
    label: "⭐ Reviews"
    folder: "_reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Reviewer Name", name: "name", widget: "string" }
      - { label: "Product/Session Code", name: "code", widget: "string" }
      - { label: "Rating", name: "rating", widget: "select", options: ["5", "4", "3"] }
      - { label: "Review Text", name: "body", widget: "text" }
      - { label: "Approved", name: "approved", widget: "boolean", default: false }

  - name: "gallery"
    label: "📸 Images / Gallery"
    folder: "_gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
